<div class="scholar-widget">
  <h3>📚 Google Scholar Profile</h3>

  <div class="scholar-stats">
    <div class="stat">
      <span class="number">{{ site.data.scholar.citations }}</span>
      <span class="label">Citations</span>
    </div>

    <div class="stat">
      <span class="number">{{ site.data.scholar.h_index }}</span>
      <span class="label">h-index</span>
    </div>

    <div class="stat">
      <span class="number">{{ site.data.scholar.i10_index }}</span>
      <span class="label">i10-index</span>
    </div>
  </div>

  <a href="https://scholar.google.com/citations?user={{ include.scholar_id }}&hl=en" target="_blank">
    View Full Profile →
  </a>

  <p style="text-align: center; font-size: 12px; color: #888; margin-top: 10px;">
    Updated automatically
  </p>
</div>
